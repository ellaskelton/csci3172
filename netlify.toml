# Netlify config – Frontend + Backend + Tests (per course guide)

[build]
  publish = "frontend"
  command = "echo 'No build step'"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"

[functions]
  external_node_modules = ["express"]
  node_bundler = "esbuild"

# Proxy /api/* to the Express serverless function
[[redirects]]
  force = true
  from = "/api/*"
  status = 200
  to = "/.netlify/functions/api/:splat"
