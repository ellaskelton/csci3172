<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Grade Book - Lab 2</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Class Grade Book</h1>
            <p class="subtitle">CSCI 3172 - Lab 2</p>
        </header>
        
        <main>
            <div class="table-wrapper">
                <table id="gradeBookTable">
                    <thead>
                        <tr>
                            <th>Student Name</th>
                            <th>Course 1</th>
                            <th>Course 2</th>
                            <th>Course 3</th>
                            <th>Course 4</th>
                            <th>Avg. Number Grade</th>
                            <th>Avg. Letter Grade</th>
                        </tr>
                    </thead>
                    <tbody id="gradeBookBody">
                    </tbody>
                </table>
            </div>
            
            <div class="info-box">
                <p><strong>Note:</strong> Click a students name to view course details.</p>
            </div>
        </main>
        
        <footer>
            <p>&copy; 2025 CSCI 3172 Lab 2</p>
        </footer>
    </div>
    
    <script src="js/script.js"></script>
</body>
</html>
