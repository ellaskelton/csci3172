<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<title>Fantastic Beasts Sanctuary</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
	<link rel="stylesheet" href="css/style.css">
</head>
<body>
	<div class="container">
		<h1>Fantastic Beasts Sanctuary</h1>

		<div class="search-section mb-4">
			<div class="form-group">
				<label for="searchInput">Search Creatures (by Name or Type):</label>
				<input type="text" id="searchInput" class="form-control" placeholder="Enter creature name or type to search...">
			</div>
		</div>

		<form id="addCreatureForm">
			<h3>Add New Creature</h3>
			<div class="form-group">
				<label for="creatureName">Creature Name: <span class="text-danger">*</span></label>
				<input type="text" id="creatureName" required class="form-control" placeholder="e.g., Niffler">
			</div>
			<div class="form-group">
				<label for="creatureType">Creature Type: <span class="text-danger">*</span></label>
				<input type="text" id="creatureType" required class="form-control" placeholder="e.g., Beast">
			</div>
			<div class="form-group">
				<label for="creatureHabitat">Habitat: <span class="text-danger">*</span></label>
				<input type="text" id="creatureHabitat" required class="form-control" placeholder="e.g., Forests">
			</div>
			<div class="form-group">
				<label for="creatureImageUrl">Image URL (optional):</label>
				<input type="url" id="creatureImageUrl" class="form-control" placeholder="https://example.com/image.jpg">
			</div>
			<div class="form-group">
				<label for="creatureNotes">Notes (optional):</label>
				<textarea id="creatureNotes" class="form-control" rows="3" placeholder="Add any additional notes about this creature..."></textarea>
			</div>
			<button type="submit" class="btn btn-primary">Add Creature</button>
		</form>

		<div class="mt-5">
			<h3>Creature Sanctuary</h3>
			<div id="creatureSanctuary"></div>
		</div>
	</div>
    <script src="js/script.js"></script>
	<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.7/dist/umd/popper.min.js" integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/js/bootstrap.min.js" integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM" crossorigin="anonymous"></script>
</body>
</html>
